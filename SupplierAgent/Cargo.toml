[package]
name = "agentcon-supplier"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
a2a = { package = "a2a-lf", version = "=0.4.1" }
a2a-server = { package = "a2a-server-lf", version = "=0.5.1", default-features = false }
github-copilot-sdk = "=1.0.20-preview.2"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "grpc-tonic", "http-proto", "reqwest-blocking-client", "tls-roots"] }
tracing-opentelemetry = "0.32"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
opentelemetry_sdk = { version = "0.31", features = ["testing"] }
