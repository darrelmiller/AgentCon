{{- if not .Values.identity.existingSecret }}
# The seller's own did:web private key only; other sellers' keys stay in Vault.
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "seller.fullname" . }}-identity
  labels:
    {{- include "seller.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.identity.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.identity.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "seller.identitySecret" . }}
    creationPolicy: Owner
  data:
    - secretKey: key.pem
      remoteRef:
        key: {{ .Values.identity.vaultPath }}
        property: {{ required "identity.keyProperty is required" .Values.identity.keyProperty }}
{{- end }}
{{- if and .Values.modelCreds.enabled (not .Values.modelCreds.existingSecret) }}
---
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "seller.fullname" . }}-model
  labels:
    {{- include "seller.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.modelCreds.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.modelCreds.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "seller.modelSecret" . }}
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: {{ .Values.modelCreds.vaultPath }}
        property: {{ .Values.modelCreds.apiKeyProperty }}
    - secretKey: base-url
      remoteRef:
        key: {{ .Values.modelCreds.vaultPath }}
        property: {{ .Values.modelCreds.baseUrlProperty }}
{{- end }}
