{{- if .Values.http.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "seller.fullname" . }}
  labels:
    {{- include "seller.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "seller.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.http.port }}
      targetPort: http
---
# The seller's HTTP port checks no credentials itself: only the router behind the OIDC gateway may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "seller.fullname" . }}
  labels:
    {{- include "seller.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "seller.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            {{- toYaml .Values.http.allowFrom.podSelector | nindent 12 }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
